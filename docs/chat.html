<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BhaktiAI – AI-Chat</title>
  <meta name="description" content="HareKrishnaAI – dein spiritueller Chat für Bhagavad Gita, Krishna und vedische Weisheit.">
  <link rel="stylesheet" href="styles.css?v=20260918"><link rel="stylesheet" href="app.css">
  <meta name="theme-color" content="#412781">
</head>
<body class="chat-page">
  <header class="chat-topbar">
    <a class="chat-back" href="index.html">← <span data-chat-i18n="back">Zur Wissensseite</span></a>
    <div class="chat-brand"><span class="chat-brand-icon">🪷</span><span><strong>BhaktiAI</strong><small data-chat-i18n="subtitle">Dein spiritueller AI-Chat</small></span></div>
    <label class="chat-language"><span class="sr-only" data-chat-i18n="language">Sprache</span><select id="chat-language" aria-label="Sprache"><option value="de">Deutsch</option><option value="en">English</option></select></label>
  </header>
  <main class="chat-shell">
    <section class="chat-window" aria-labelledby="chat-title">
      <div class="chat-window-heading">
        <div><p class="eyebrow">✦ HAREKRISHNAAI</p><h1 id="chat-title" data-chat-i18n="title">Frage die AI</h1><p data-chat-i18n="intro">Antworten zu Bhagavad Gita, Krishna und vedischer Weisheit.</p></div>
        <span class="chat-online"><i></i><span data-chat-i18n="online">Bereit</span></span>
      </div>
      <div id="chat-messages" class="chat-messages chat-window-messages" aria-live="polite"><div class="chat-message assistant" data-chat-i18n="welcome">🙏 Hare Krishna! Was möchtest du wissen?</div></div>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="chat-input" data-chat-i18n="placeholder">Deine Frage</label>
        <textarea id="chat-input" rows="2" maxlength="2000" data-chat-i18n-placeholder="placeholder" placeholder="Deine Frage …"></textarea>
        <div class="chat-controls"><button id="chat-send" type="submit" data-chat-i18n="send">Senden</button></div>
      </form>
      <p id="chat-error" class="chat-error hidden" role="alert"></p>
      <p class="chat-note" data-chat-i18n="note">Die AI antwortet über das HareKrishnaAI-Backend. Deine lokale Modelladresse bleibt im Browser verborgen.</p>
    </section>
  </main>
  <script>window.BHAKTI_CHAT_API_URL = "https://harekrishnaai.onrender.com";</script>
  <script src="chat.js?v=20260920"></script>
</body>
</html>
