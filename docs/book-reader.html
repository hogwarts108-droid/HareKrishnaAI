<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buch lesen – BhaktiAI</title>
  <link rel="stylesheet" href="styles.css?v=20260909">
</head>
<body>
  <header class="hero book-hero">
    <div class="site-language-bar"><label for="reader-language">Sprache</label><select id="reader-language"><option value="de">Deutsch</option><option value="en">English</option></select></div>
    <div class="lotus">📖</div>
    <h1 id="reader-title">Buch</h1>
    <p id="reader-subtitle">Originaltext im integrierten Leser</p>
    <nav class="nav"><a href="index.html">← Zurück zu den Büchern</a></nav>
  </header>
  <main class="reader-main">
    <section class="panel">
      <p id="reader-note" class="reader-note">Das Original wird direkt innerhalb dieser Seite angezeigt.</p>
      <iframe id="external-reader" class="external-reader" title="Buchleser"></iframe>
      <p id="reader-fallback" class="reader-fallback">Falls der Leser nicht angezeigt wird: <a id="direct-reader" target="_blank" rel="noopener noreferrer">Originalleser öffnen</a>.</p>
    </section>
  </main>
  <script>
    const books = {
      "bhagavad-gita": ["Bhagavad-gita", 2],
      "bhagavatam-1": ["Srimad-Bhagavatam – Erster Canto", "books/bhagavatam/srimad-bhagavatam-erster-canto.pdf"],
      "bhagavatam-2": ["Srimad-Bhagavatam – Zweiter Canto", "books/bhagavatam/srimad-bhagavatam-zweiter-canto.pdf"],
      "bhagavatam-3-1": ["Srimad-Bhagavatam – Dritter Canto, Teil 1", "books/bhagavatam/srimad-bhagavatam-dritter-canto-teil-1.pdf"],
      "bhagavatam-3-2": ["Srimad-Bhagavatam – Dritter Canto, Teil 2", "books/bhagavatam/srimad-bhagavatam-dritter-canto-teil-2.pdf"],
      "bhagavatam-4-1": ["Srimad-Bhagavatam – Vierter Canto, Teil 1", "books/bhagavatam/srimad-bhagavatam-vierter-canto-teil-1.pdf"],
      "bhagavatam-4-2": ["Srimad-Bhagavatam – Vierter Canto, Teil 2", "books/bhagavatam/srimad-bhagavatam-vierter-canto-teil-2.pdf"],
      "bhagavatam-5": ["Srimad-Bhagavatam – Fünfter Canto", "books/bhagavatam/srimad-bhagavatam-fuenfter-canto.pdf"],
      "bhagavatam-6": ["Srimad-Bhagavatam – Sechster Canto", "books/bhagavatam/srimad-bhagavatam-sechster-canto.pdf"],
      "bhagavatam-7": ["Srimad-Bhagavatam – Siebter Canto", "books/bhagavatam/srimad-bhagavatam-siebter-canto.pdf"],
      "bhagavatam-8": ["Srimad-Bhagavatam – Achter Canto", "books/bhagavatam/srimad-bhagavatam-achter-canto.pdf"],
      "bhagavatam-9": ["Srimad-Bhagavatam – Neunter Canto", "books/bhagavatam/srimad-bhagavatam-neunter-canto.pdf"],
      "bhagavatam-10-1": ["Srimad-Bhagavatam – Zehnter Canto, Teil 1", "books/bhagavatam/srimad-bhagavatam-zehnter-canto-teil-1.pdf"],
      "krishna-source-1": ["Krishna – Die Quelle aller Freude, Band 1", "books/krishna/krishna-die-quelle-aller-freude-band-1.pdf"],
      "krishna-source-2": ["Krishna – Die Quelle aller Freude, Band 2", "books/krishna/krishna-die-quelle-aller-freude-band-2.pdf"],
      "krishna-1974-1": ["Krishna-Buch 1974, Band 1", "books/krishna/krishna-buch-1974-band-1.pdf"],
      "krishna-1974-2": ["Krishna-Buch 1974, Band 2", "books/krishna/krishna-buch-1974-band-2.pdf"],
      "krishna-1975-3": ["Krishna-Buch 1975, Band 3", "books/krishna/krishna-buch-1975-band-3.pdf"],
      caitanya: ["Caitanya-caritamrta", 5633],
      nectar: ["Nectar of Devotion", 6311],
      journey: ["Easy Journey to Other Planets", 4327],
      light: ["Light of the Bhagavata", 4329],
      kapila: ["Teachings of Lord Kapila", 4756],
      brahma: ["Brahma Samhita", 3701]
    };
    const labels = { de: ["Sprache", "Originaltext im integrierten Leser", "Das Original wird direkt innerhalb dieser Seite angezeigt.", "Originalleser öffnen", "← Zurück zu den Büchern"], en: ["Language", "Original text in the integrated reader", "The original is displayed directly inside this page.", "Open original reader", "← Back to books"] };
    const key = new URLSearchParams(location.search).get("book") || "bhagavad-gita";
    const book = books[key] || books["bhagavad-gita"];
    const language = localStorage.getItem("bhaktiai-language") || "de";
    document.getElementById("reader-language").value = language;
    document.getElementById("reader-title").textContent = book[0];
    document.title = `${book[0]} – BhaktiAI`;
    const url = typeof book[1] === "string" && book[1].startsWith("books/") ? book[1] : `https://prabhupadabooks.com/d.php?id=${book[1]}`;
    document.getElementById("external-reader").src = url;
    document.getElementById("direct-reader").href = url;
    function applyReaderLanguage(value) {
      localStorage.setItem("bhaktiai-language", value);
      document.documentElement.lang = value;
      const copy = labels[value];
      document.querySelector(".site-language-bar label").textContent = copy[0];
      document.getElementById("reader-subtitle").textContent = copy[1];
      document.getElementById("reader-note").textContent = copy[2];
      document.getElementById("reader-fallback").firstChild.textContent = `${copy[2]} `;
      document.querySelector(".nav a").textContent = copy[4];
    }
    document.getElementById("reader-language").addEventListener("change", event => applyReaderLanguage(event.target.value));
    applyReaderLanguage(language);
  </script>
</body>
</html>
